<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Book &amp; Quill</title>
    <link rel="icon" type="image/png" href="assets/minecraftly.png" />
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body>
    <main class="screen" aria-label="Minecraft-style book and quill note editor">
      <section class="scene" aria-label="Book and quill">
        <img class="artwork" src="assets/book-and-quill.png?v=19" alt="" draggable="false" />

        <div class="page-count" id="page-count">Page 1 of 1</div>
        <div id="book-text" class="writing-area" contenteditable="true" role="textbox"
          aria-label="Write in your book" aria-multiline="true" spellcheck="false" tabindex="0"></div>
        <span class="underscore-caret" id="underscore-caret" aria-hidden="true"></span>

        <button class="page-turn page-back" id="previous-page" type="button" aria-label="Previous page" hidden></button>
        <button class="page-turn page-forward" id="next-page" type="button" aria-label="Next page">
          <span class="visually-hidden">Next page</span>
        </button>

        <button class="resize-toggle" id="resize-toggle" type="button" aria-label="Expand" title="Expand" hidden>
          <img src="assets/expand.png" alt="" draggable="false" />
        </button>

        <button class="hotspot export" id="export-button" type="button" aria-label="Export the book" aria-haspopup="dialog" aria-expanded="false">
          <span class="visually-hidden">Export</span>
        </button>
        <button class="hotspot done" id="done-button" type="button" aria-label="Save and finish">
          <span class="visually-hidden">Done</span>
        </button>

        <div class="export-dialog" id="export-dialog" role="dialog" aria-modal="true" aria-labelledby="export-title" hidden>
          <div class="export-panel">
            <h1 id="export-title">Export As</h1>
            <div class="export-options">
              <button class="export-option" type="button" data-export="pdf">PDF (Notebook)</button>
              <button class="export-option" type="button" data-export="docx">DOCX (Text)</button>
              <button class="export-option" type="button" data-export="markdown">Markdown (Text)</button>
            </div>
            <button class="export-back" id="close-export" type="button">Back</button>
          </div>
        </div>
      </section>
    </main>
    <div class="print-document" id="print-document" aria-hidden="true"></div>
    <script src="app.js?v=19"></script>
  </body>
</html>
